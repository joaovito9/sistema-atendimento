<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Atendimentos</title>
</head>
<body>
    <h1>Atendimentos</h1>
    <a th:href="@{/atendimentos/novo}">Novo Atendimento</a>
    <table border="1">
        <thead>
            <tr>
                <th>Paciente</th>
                <th>Procedimento</th>
                <th>Valor Pago</th>
                <th>Data/Hora</th>
                <th>Observações</th>
                <th>Confirmado</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${atendimentos}">
                <td th:text="${a.paciente.nome}"></td>
                <td th:text="${a.procedimento}"></td>
                <td th:text="${a.valorPago}"></td>
                <td th:text="${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${a.observacoes}"></td>
                <td th:text="${a.confirmado ? 'Sim' : 'Não'}"></td>
                <td>
                    <a th:href="@{'/atendimentos/editarAtendimento/' + ${a.id}}">Editar</a> |
                    <a th:href="@{'/atendimentos/excluirAtendimento/' + ${a.id}}">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
